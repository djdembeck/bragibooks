# Generated by setup-ci. Mirrors ci.yml — edit the ci.yml/tool map, not these commands. A git commit --no-verify bypass is still caught by ci.yml.
repos:
  - repo: local
    hooks:
      - id: svelte-check
        name: Svelte check
        entry: cd web && bun run check
        language: system
        types: [file]
        files: ^web/
        pass_filenames: false

      - id: go-vet
        name: Go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: build
        name: Build
        entry: make build
        language: system
        types: [file]
        pass_filenames: false

      - id: go-test
        name: Go test
        entry: go test ./internal/...
        language: system
        types: [go]
        pass_filenames: false
