[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bragibooks"
version = "1.2.3"
description = "Bragibooks - Audiobook Processing Tool"
requires-python = ">=3.10"
dependencies = [
    "celery>=5.2",
    "Django>=6.1,<6.2",
    "gunicorn>=20.1.0",
    "kombu==5.6.2",
    "rapidfuzz>=3.0",
    "requests>=2.28",
    "sqlalchemy>=2.0.0",
    "whitenoise==6.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bragibooks_proj*", "importer*", "utils*"]
exclude = ["docker*", "config*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-django>=4.5.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bragibooks_proj.settings"
python_files = ["test_*.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py310"]
include = "\\.pyi?$"
