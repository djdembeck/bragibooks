name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:

  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PR_IS_SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Prevent PRs from forks from pushing images
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Resolve PR number
        id: pr-number
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=""
          if command -v gh >/dev/null 2>&1; then
            PR_NUMBER=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --json number -q '.[0].number' 2>/dev/null || echo "")
          elif [ -n "${GH_TOKEN}" ]; then
            PR_NUMBER=$(curl -sf -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY%/*}:${GITHUB_REF_NAME}&state=open" \
              | jq -r '.[0].number // empty' 2>/dev/null || echo "")
          fi
          if [ "${PR_NUMBER}" = "null" ] || [ -z "${PR_NUMBER}" ]; then
            PR_NUMBER=""
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' || env.PR_IS_SAME_REPO == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request' || env.PR_IS_SAME_REPO == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            djdembeck/bragibooks
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=pr-${{ steps.pr-number.outputs.number }},enable=${{ github.event_name == 'workflow_dispatch' && steps.pr-number.outputs.number != '' }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || env.PR_IS_SAME_REPO == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            M4B_MERGE_REF=develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Find existing PR comment
        if: env.PR_IS_SAME_REPO == 'true' || (github.event_name == 'workflow_dispatch' && steps.pr-number.outputs.number != '')
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number || steps.pr-number.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Docker Image Ready'

      - name: Comment PR with image tags
        if: env.PR_IS_SAME_REPO == 'true' || (github.event_name == 'workflow_dispatch' && steps.pr-number.outputs.number != '')
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number || steps.pr-number.outputs.number }}
          body: |
            ## 🐳 Docker Image Ready

            The following image tag is available for testing this PR:

            | Tag | Image |
            |-----|-------|
            | `pr-${{ github.event.pull_request.number || steps.pr-number.outputs.number }}` | `ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number || steps.pr-number.outputs.number }}` |

            **Note:** This tag is stable for this PR. Each new commit will overwrite this tag with the latest build.

            **To test:**
            ```bash
            docker pull ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number || steps.pr-number.outputs.number }}
            docker run --rm -v /host/media:/media:rw ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number || steps.pr-number.outputs.number }}
            ```

            Images will be automatically deleted when this PR is merged or closed.
          edit-mode: replace
