name: Cleanup PR Docker Images

on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-cleanup-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  cleanup-pr-images:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      packages: write
      contents: read

    steps:
      - name: Delete PR Docker images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          ORG: ${{ github.event.repository.owner.login }}
        run: |
          echo "Looking for images with tag: pr-${PR_NUMBER}"

          # Get package versions - try orgs endpoint first, then users endpoint
          versions=""
          api_prefix="orgs"
          if versions=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/${ORG}/packages/container/${PACKAGE_NAME}/versions" 2>&1); then
            api_prefix="orgs"
          else
            echo "Orgs endpoint not found, trying users endpoint..."
            if versions=$(gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/${ORG}/packages/container/${PACKAGE_NAME}/versions" 2>&1); then
              api_prefix="users"
            else
              echo "Error fetching package versions from both endpoints"
              echo "$versions"
              exit 1
            fi
          fi

          # Find versions tagged with pr-N
          version_ids=$(echo "$versions" | jq -r ".[] | select((.metadata.container.tags // [])[] | . == \"pr-${PR_NUMBER}\") | .id" | sort -u)

          # Also match SHA tags from PR commits
          PR_SHAS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${ORG}/${PACKAGE_NAME}/pulls/${PR_NUMBER}/commits" \
            2>/dev/null | jq -r '.[].sha') || true

          if [ -n "$PR_SHAS" ]; then
            for sha in $PR_SHAS; do
              short_sha="${sha:0:7}"
              matched=$(echo "$versions" | jq -r ".[] | select((.metadata.container.tags // [])[] | . == \"sha-${short_sha}\") | .id" | sort -u)
              if [ -n "$matched" ]; then
                version_ids="${version_ids}"$'\n'"${matched}"
              fi
            done
            version_ids=$(echo "$version_ids" | sort -u)
          fi

          if [ -z "$version_ids" ]; then
            echo "No images found for pr-${PR_NUMBER}"
            exit 0
          fi

          # Delete each version
          failures=""
          for version_id in $version_ids; do
            echo "Deleting package version: $version_id"
            if gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/${api_prefix}/${ORG}/packages/container/${PACKAGE_NAME}/versions/${version_id}"; then
              echo "Successfully deleted package version: $version_id"
            else
              echo "ERROR: Failed to delete package version: $version_id"
              failures="${failures:+$failures,}$version_id"
            fi
          done

          if [ -z "$failures" ]; then
            echo "Cleanup COMPLETE: pr-${PR_NUMBER}"
          else
            echo "Cleanup FAILED - pr-${PR_NUMBER}:"
            echo "  Organization: $ORG"
            echo "  Package: $PACKAGE_NAME"
            echo "  Failed to delete versions: $failures"
            exit 1
          fi
