name: Cleanup PR Docker Images

on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-cleanup-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  cleanup-pr-images:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      packages: write
      contents: read

    steps:
      - name: Delete PR Docker images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          ORG: ${{ github.event.repository.owner.login }}
        run: |
          echo "Looking for images with tag: pr-${PR_NUMBER}"

          # Get package versions - try orgs endpoint first, then users endpoint
          versions=""
          api_prefix="orgs"
          if versions=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/${ORG}/packages/container/${PACKAGE_NAME}/versions" 2>&1); then
            api_prefix="orgs"
          else
            echo "Orgs endpoint not found, trying users endpoint..."
            if versions=$(gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/${ORG}/packages/container/${PACKAGE_NAME}/versions" 2>&1); then
              api_prefix="users"
            else
              echo "Error fetching package versions from both endpoints"
              echo "$versions"
              exit 1
            fi
          fi

          # SHA tags from PR commits
          PR_SHAS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${ORG}/${PACKAGE_NAME}/pulls/${PR_NUMBER}/commits" \
            2>/dev/null | jq -r '.[].sha') || true

          # Tags owned by this PR: pr-N and sha-<short> of every PR commit.
          # A version is only deletable when ALL of its tags are owned by
          # this PR, except tags of branches that no longer exist (an
          # auto-deleted head branch leaves an orphan tag). A PR's commit
          # list is a subset of the head branch's history, so a PR whose
          # head is a long-lived branch (develop→main) matches the version
          # that also carries that branch's tag — the develop tip IS the
          # PR head, same digest — and the branch image would be deleted
          # along with the preview.
          PR_OWNED="pr-${PR_NUMBER}"
          for sha in $PR_SHAS; do
            PR_OWNED="${PR_OWNED}"$'\n'"sha-${sha:0:7}"
          done
          PR_OWNED=$(echo "$PR_OWNED" | sort -u)

          # Candidate versions: tagged pr-N or sha-<PR commit>.
          version_ids=$(echo "$versions" | jq -r \
            --arg pr "$PR_NUMBER" \
            --argjson owned "$(echo "$PR_OWNED" | jq -R . | jq -s .)" '
              [ .[]
                | select(((.metadata.container.tags // [])
                          | map(. as $t | . == ("pr-" + $pr)
                                      or (($owned | index($t)) != null)))
                         | any)
                | .id ]
              | unique
              | .[]')

          if [ -z "$version_ids" ]; then
            echo "No images found for pr-${PR_NUMBER}"
            exit 0
          fi

          # Fetch the live branches ONCE. The docker metadata action
          # sanitizes branch names when tagging (feature/foo -> feature-foo),
          # so a tag matches a live branch when it equals the branch name
          # OR the branch name with "/" replaced by "-".
          LIVE_BRANCHES=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${ORG}/${PACKAGE_NAME}/branches" \
            2>/dev/null | jq -r '.[].name') || true
          # Union of every live branch name and its sanitized form, one per
          # line; a tag is branch-owned when it appears in this set.
          LIVE_TAGS=$(echo "$LIVE_BRANCHES" | sed 's|/|-|g' | { cat; echo "$LIVE_BRANCHES"; } | sort -u)

          # Delete each version, skipping any that carries the tag of a
          # currently-existing branch (develop, main, a live head branch):
          # deleting the version would remove that branch image too.
          failures=""
          for version_id in $version_ids; do
            protected=""
            for tag in $(echo "$versions" | jq -r --argjson id "$version_id" '.[] | select(.id == $id) | .metadata.container.tags // [] | .[]' | sort -u); do
              if echo "$PR_OWNED" | grep -qxF "$tag"; then
                continue
              fi
              if echo "$LIVE_TAGS" | grep -qxF "$tag"; then
                protected="$tag"
                break
              fi
            done
            if [ -n "$protected" ]; then
              echo "Skipping version $version_id: carries live branch tag '$protected'"
              continue
            fi
            echo "Deleting package version: $version_id"
            if gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/${api_prefix}/${ORG}/packages/container/${PACKAGE_NAME}/versions/${version_id}"; then
              echo "Successfully deleted package version: $version_id"
            else
              echo "ERROR: Failed to delete package version: $version_id"
              failures="${failures:+$failures,}$version_id"
            fi
          done

          if [ -z "$failures" ]; then
            echo "Cleanup COMPLETE: pr-${PR_NUMBER}"
          else
            echo "Cleanup FAILED - pr-${PR_NUMBER}:"
            echo "  Organization: $ORG"
            echo "  Package: $PACKAGE_NAME"
            echo "  Failed to delete versions: $failures"
            exit 1
          fi
