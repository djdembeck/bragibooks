name: Lint & Format

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (lint) + Black (check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff
        run: ruff check .

      - name: Run black (check)
        run: black --check .

  autofix:
    name: Autofix (manual)
    runs-on: ubuntu-latest
    needs: lint
    # Run when manually dispatched OR when a PR receives the label 'autofix'
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'autofix')
      )
    steps:
      # For pull_request labeled events we need to checkout the PR head
      # so we can push fixes back to the contributor branch. For
      # workflow_dispatch we use the default checkout.
      - name: Checkout (PR head)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Checkout (dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff --fix
        run: ruff check --fix . || true

      - name: Run black
        run: black . || true

      - name: Commit & push fixes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply ruff/black fixes" || echo "no changes to commit"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            git push origin HEAD:${{ github.ref }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
