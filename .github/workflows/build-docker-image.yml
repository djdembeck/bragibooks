name: Docker Image CI

on:
  pull_request:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build the Docker image
      run: docker build . --file docker/Dockerfile --build-arg M4B_MERGE_REF=develop --tag my-image-name:$(date +%s)
