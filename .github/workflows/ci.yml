name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test-python:
    name: Python tests
    permissions:
      actions: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gpac php-cli php-xml php-mbstring
          wget -q https://github.com/sandreas/m4b-tool/releases/latest/download/m4b-tool.tar.gz -O /tmp/m4b-tool.tar.gz
          tar xzf /tmp/m4b-tool.tar.gz -C /tmp/
          sudo mv /tmp/m4b-tool.phar /usr/local/bin/m4b-tool
          sudo chmod +x /usr/local/bin/m4b-tool

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install m4b-merge

      - name: Generate secret key for Django
        run: |
          mkdir -p config
          python -c "from django.core.management.utils import get_random_secret_key; open('config/secret_key.txt', 'w').write(get_random_secret_key())"

      - name: Run pytest
        run: |
          mkdir -p junit
          pytest -v --tb=short --junitxml=junit/results.xml
        env:
          DJANGO_SETTINGS_MODULE: bragibooks_proj.settings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: junit/*.xml

  test-js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run JS tests
        run: npm test
